# Decision thresholds — SINGLE SOURCE OF TRUTH. inference/policy_engine.py
# loads these at import time via _load_thresholds() and fails loudly if this
# file is missing, malformed, or missing a key. Edit thresholds HERE, not in
# Python. Every key below is required (static.allow_below,
# static.block_at_or_above, behavioral/memory/network/emulation
# .malicious_at_or_above, behavioral.terminate_requires_corroboration
# (boolean), behavioral.pending_with_static_allow (choice)); sequence.* and
# file.* are informational for now
# (api_tokenizer / pipeline still hold their own constants).
#
# static.* RE-DERIVED 2026-09-08 after the Platt-calibrator fix
# (models/*_lgbm.py calibrators fit on raw booster margins, not sigmoid
# probabilities; ONNX export reconstructs the margin in-graph). The static
# booster at that time was unchanged, so its AUC and operating points were
# unchanged then -- only the calibrated score scale moved. SUPERSEDED for
# static by the 2026-09-21 full retrain below; kept as history for
# memory.*/network.*, where it still describes the current values.
#
# memory.* and network.* RE-DERIVED 2026-09-10 by the split-discipline
# retrain in OPEN_ITEMS.md's "retrain cluster" section (PDF review items 2
# and 3). Those two models were retrained on a new 4-way split with a
# dedicated `cal` split: the Platt calibrator is fit on `cal` (held out of
# the booster fit AND early stopping, not the val split), and the operating
# point below is derived on `cal` alone -- `test` is untouched until the
# final scripts/evaluate_all_models.py run. Their boosters, AUCs and
# operating points all changed. static.* received the same split-discipline
# treatment in its own later session, completed 2026-09-21 (EMBER2024
# parquet regen + full retrain) -- see the static.* section below.
#
# See the per-constant comments in inference/policy_engine.py for every
# superseded value and why a calibrated score scale is never portable
# between calibrators.
#
# static.*: RE-DERIVED 2026-09-21 by the split-discipline full retrain
# (OPEN_ITEMS.md "The one authorized test read (2026-09-21, MEASURED)"),
# addressing the calibrator-fit-on-val and thresholds-derived-on-test
# parts of items 2 and 3 (item 2's interim BLOCK cap is NOT lifted; see
# below) and the ExportsInfo feature-fix regen (item 8 residue) for
# static. Full model +
# derivation + promotion record: reports/static_retrain_20260921/ (this
# repo) and OPEN_ITEMS.md's "Chosen candidate thresholds" and "The one
# authorized test read" sections.
#
# Booster retrained on the regenerated (ExportsInfo-fixed) EMBER2024 train
# split via a dedicated `cal` split (train/val/cal carve; test frozen by
# row identity, features changed by design): Platt calibrator fit on `cal`
# (held out of the booster fit AND early stopping, not val), and both
# operating points below derived via models.static_lgbm.
# find_threshold_for_fpr() on calibrated `cal` probabilities alone.
# block_at_or_above: target_fpr=0.0005 -> cal FPR 0.000496 (58/116,862
# benign FP), cal detection 0.9311; val-only check FPR 0.000615
# (72/117,001), detection 0.9326. allow_below: target_fpr=0.01 -> cal FPR
# 0.009995 (1168/116,862 benign FP), cal detection 0.9887; val-only check
# FPR 0.010231 (1197/117,001), detection 0.9890.
#
# Model/threshold pairing -- these thresholds are only valid for the model
# with .lgbm sha256
# acfa5a757aa13cd0708c00ca97f445ed86ab54d9a4e80505c7fd733157b02bea
# (LGBMModel.model_hash acfa5a757aa13cd0), .onnx sha256
# 636c77c5c536bf3ba2996205206c718d481708b39e7bb0007e4b3535874b4944.
# data/models/cortex_static.{lgbm,meta,onnx} are build outputs (gitignored,
# not committed) -- regenerate/verify against these hashes, do not assume
# the deployed files match this comment without checking.
#
# ONE-TIME held-out test read (2026-09-21, MEASURED, after these
# thresholds were pre-registered on cal alone -- see reports/
# static_retrain_20260921/PREREGISTRATION.txt): test AUC 0.998778 (>=
# 0.9985 amended gate: PASS). allow_below test FPR 0.012129 (FP
# 3274/269,940, 95% CI [0.011719,0.012549]), detection 0.9821.
# block_at_or_above test FPR 0.001011 (FP 273/269,940, 95% CI
# [0.000895,0.001139]), detection 0.9149 -- this CI contains the
# architecture doc's 0.001 bar, so block_at_or_above is AT the 0.1% bar on
# held-out data, not demonstrably below it.
#
# The prior (pre-2026-09-21) static.* thresholds below were derived
# directly on the test split itself (find_threshold_for_fpr() run against
# calibrated EMBER2024 test-split probabilities) rather than on a held-out
# cal split -- which is why their recorded test FPRs (0.009999, 0.000997)
# equal their targets (0.01, 0.001) almost exactly: that agreement was true
# by construction, not an out-of-sample result. The current thresholds are
# derived honestly on cal and read against test exactly once, so some
# in-sample-vs-out-of-sample drift (e.g. the higher measured allow_below
# test FPR above) is expected and is the main reason the two derivations
# aren't directly comparable -- the EMBER2024 ExportsInfo feature
# regeneration between them being a secondary, smaller factor is INFERRED,
# not measured (no ablation isolating it from the derivation-methodology
# difference above has been run).
#
# Static BLOCK verdicts remain capped to ALERT by the interim
# corroboration-gated policy (inference/policy_engine.py::decide(), item 2
# in OPEN_ITEMS.md) -- unchanged by this retrain; only corroborated
# multi-signal cases still reach BLOCK.
#
# behavioral.*: re-derived against data/models/cortex_behavioral_best.pt
# (1D-CNN+attention, trained on the deduplicated Mal-API-2019+MalbehavD-V1+
# Carpenter behavioral dataset) via a threshold sweep (0.10-0.99) on the
# val+test splits combined (1,835 rows, 274 benign) -- not a precise
# find_threshold_for_fpr() target like static's, since 274 benign samples
# (~0.36% resolution per sample) can't support a precise-sounding FPR claim.
#
# 0.60 rather than the higher end of the zero-observed-FP range (~0.922+):
# there is exactly one persistent false positive across the whole sweep, a
# MalbehavD-V1 benign sample whose trace includes networking-setup calls
# (setsockopt, ioctlsocket, wsastartup, getsockname) alongside routine
# registry/system calls -- plausibly confusable with C2 setup, and the model
# is confidently wrong about it (scores 0.921006, not a wobbly near-threshold
# case). Below its exact score, ANY threshold produces this one false
# positive; from ~0.922 up, false positives disappear on the data we have.
# 0.60 deliberately does NOT clear that single case. Malicious recall climbs
# steadily as the threshold drops (FN count on val+test: 57 at 0.95, 49 at
# 0.90, ~38 at 0.60, 36 at 0.50), and n=1 evidence isn't a sound basis for a
# permanent recall tradeoff across the whole malicious population --
# especially since behavioral currently has no downstream backstop in this
# repo (no rule-based overlay for high-risk call combinations independent of
# the ML score). If/when more real benign network-adjacent software traces
# are added to training data, or the architecture research's rule-based
# overlay for high-risk call combinations gets built, that's the more
# targeted fix for this class of ambiguity -- not blanket threshold tuning
# in response to a single hard example.
#
# memory.*: re-derived 2026-09-10 against a retrained data/models/cortex_memory
# (LightGBM + Platt calibration) on the new 4-way split from
# scripts/split_memory.py --cal-frac 0.2 (34,949 train / 5,930 val / 11,787
# cal / 5,930 test). Calibrator fit on `cal`; operating point from
# models.memory_lgbm.find_threshold_for_fpr() at target_fpr=0.01 on the
# calibrated `cal` probabilities alone (11,787 rows, 5,860 benign); `test`
# not read during training or threshold selection. Result: threshold
# 0.0024964628, actual FPR 0.9556% (56/5,860 benign FP), detection_rate
# 0.9993 on cal -- the honest number; the old val+test derivation reported
# recall 1.0000 at this target, and that ~0.1 pp is the removed optimism.
# Same target_fpr choice as before, kept rather than re-picked from the new
# numbers (56 benign FP is well-supported; detection barely moves at looser
# targets). Held-out test metrics regenerated in EVAL_ALL_MODELS_RESULTS.txt.
#
# Still internally valid on CIC-MalMem-2022 but likely optimistic for
# production, for the documented single-VM-benign reason: every benign
# sample is a repeated capture of one baseline Windows 10 VM, and a large
# fraction of features are individually near-separating on this data (the
# prior pass measured 22 of 62 above 0.95 AUC -- a dataset property, not a
# per-model artifact; docs/TECHNICAL_NOTES.md's "Training results and the separability
# finding" section is the reference). malicious_at_or_above only computes
# MemoryVerdict, and that verdict is policy-capped at ALERT
# (inference/policy_engine.py::decide()), never BLOCK/TERMINATE: the split-
# discipline retrain fixes calibration/threshold honesty, not feature
# fidelity, so the cap stays.
#
# network.*: re-derived 2026-09-10 against a retrained data/models/cortex_network
# (LightGBM + Platt calibration) on the new 4-way split from
# scripts/split_network.py --cal-frac 0.1 (1,331,042 train / 211,697 val /
# 195,715 cal / 213,217 test). Calibrator fit on `cal`; operating point at
# target_fpr=0.001 on the calibrated `cal` probabilities alone (195,715
# rows, 160,863 benign -- one FP moves observed FPR by ~0.0006%); `test` not
# read during training or threshold selection. Result: threshold
# 0.6672636218, actual FPR 0.0988% (159/160,863 benign FP), detection_rate
# 0.9626 on cal. The old val+test derivation reported held-out recall
# 0.9752; that ~1.3 pp gap is the removed calibration/threshold optimism,
# not a regression. Same target_fpr choice as before. Single-feature-AUC
# sweep on train and cal: 0/78 features above 0.95 (max ~0.77) -- no fixed-
# testbed shortcut. Held-out test metrics regenerated in
# EVAL_ALL_MODELS_RESULTS.txt.
#
# Like memory, malicious_at_or_above only computes NetworkVerdict, and that
# verdict is policy-capped at ALERT, never BLOCK/TERMINATE -- for two
# independent, evidence-backed reasons unaffected by the retrain (both are
# dataset/representation properties, not calibration artifacts): (a)
# Infiltration attacks lack the flow-statistics signature CICFlowMeter
# captures -- a representation ceiling (~10.75% detection on that class in
# the prior test pass, at n_train=11,463, i.e. not under-training); (b)
# models "nearly perfect" on CSE-CIC-IDS2018 -- which this one is -- degrade
# toward random on external traffic. Per-attack-type table now in
# scripts/evaluate_all_models.py's output; that plus ~7.5% documented label
# noise in docs/TECHNICAL_NOTES.md's Cortex-Network section.

static:
  allow_below: 0.4789517595186417      # score <  this -> ALLOW   (superseded: 0.5471026402140103, pre-calibration-fix: 0.6163460957)
  block_at_or_above: 0.9811748406902472  # score >= this -> BLOCK (else ALERT)  (superseded: 0.9798998555119341, pre-fix: 0.9950119117)

behavioral:
  malicious_at_or_above: 0.60  # score >= this -> MALICIOUS, else BENIGN
  # docs/CODE_REVIEW.md F4. true (default): behavioral MALICIOUS reaches
  # TERMINATE only when static is ALERT or BLOCK on the same file; otherwise
  # (static ALLOW incl. allowlisted, or ERROR) it is ALERT with reason
  # behavioral_malicious_uncorroborated. false restores the legacy
  # unconditional TERMINATE.
  terminate_requires_corroboration: true
  # docs/CODE_REVIEW.md F13. Final decision when static is ALLOW, no signal is
  # malicious or errored, and the requested behavioral check is PENDING (trace
  # too short to score). One of ALLOW_UNVERIFIED (default), NEEDS_REVIEW, or
  # ALLOW (legacy silent pass).
  pending_with_static_allow: ALLOW_UNVERIFIED

memory:
  malicious_at_or_above: 0.0024964628  # score >= this -> MALICIOUS, else BENIGN (capped at ALERT, never BLOCK/TERMINATE). Derived 2026-09-10 on the new cal split, target_fpr=0.01 (56/5,860 benign FP, detection 0.9993). Superseded: 0.0006464189644018, 0.0005358335957155212

network:
  malicious_at_or_above: 0.6672636218  # score >= this -> MALICIOUS, else BENIGN (capped at ALERT, never BLOCK/TERMINATE). Derived 2026-09-10 on the new cal split, target_fpr=0.001 (159/160,863 benign FP, detection 0.9626). Superseded: 0.5883628015255921, 0.9441855970306654

# emulation.*: LOGGING / TELEMETRY ONLY -- not a policy input. target_fpr=1%
# point from the val+test sweep against data/models/cortex_emulation_best.pt
# (1D-CNN+attention, embed_dim=64, Quo Vadis Speakeasy module_entry traces).
# Cortex-Emulation is NOT in inference/policy_engine.py::decide() -- its
# deployment status is report-only / additive (mirroring malware-ml's
# Behavioral v2: additive_report_only_not_in_policy_decision). Reason is
# stricter than memory's/network's ALERT cap: an ablation-confirmed Jan->Apr
# 2022 temporal concept-drift collapse (malicious recall 70.7% -> 41.5% at
# embed_dim=64, 68.0% -> 38.3% at embed_dim=32 -- unchanged by capacity
# reduction) and only ~+3-4 pp test accuracy over a trivial train-sequence
# duplicate-lookup baseline. Full sweep table + drift diagnostic in the
# docs/TECHNICAL_NOTES.md's "Cortex-Emulation" section.
emulation:
  malicious_at_or_above: 0.999358594417572  # telemetry EmulationVerdict only; never reaches decide()

sequence:
  max_api_calls: 100

file:
  max_size_bytes: 104857600  # 100 MiB
